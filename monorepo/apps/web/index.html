<!doctype html>
<html lang="ar" dir="rtl" class="dark">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/KkCv1LF/Logo-Al3amer.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مركز العامر - لأجهزة الكاشير وأنظمة المحاسبة</title>
  <meta name="description" content="المركز الرائد في مصر لتوريد وتركيب أجهزة الكاشير، أنظمة نقاط البيع، كاميرات المراقبة، والحلول التقنية للمحلات التجارية والمطاعم" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="مركز العامر" />
  <meta property="og:locale" content="ar_EG" />
  <meta name="theme-color" content="#0d121c" />
  <link rel="alternate" type="text/markdown" href="/llm-catalog.md" title="AI-Ready Product Catalog" />

  <!-- Critical preconnects (max 2 for performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://al3amer-store-wf1t.vercel.app" crossorigin />

  <!-- Preload Logo -->
  <link rel="preload" as="image" href="https://i.ibb.co/KkCv1LF/Logo-Al3amer.png" fetchpriority="high" />

  <style>
    :root {
      --bg: #0d121c;
      --primary: #135bec;
      --surface: #161b26;
      --text: #e2e8f0;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      margin: 0;
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #root > .sk-wrap { display: block; }
    #root.hydrated > .sk-wrap { display: none; }
    .sk-header {
      height: 80px;
      background: rgba(13,18,28,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      padding: 0 5%;
    }
    .sk-logo {
      height: 40px;
      width: 120px;
      object-fit: contain;
      opacity: 0.7;
    }
    .sk-hero {
      min-height: 550px;
      display: flex;
      align-items: center;
      padding: 40px 5%;
      background: var(--bg);
    }
    @media (min-width: 1024px) { .sk-hero { min-height: 680px; } }
    .sk-content { max-width: 700px; }
    .sk-bar {
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 16px;
      height: 48px;
      width: 75%;
    }
    .sk-bar.sm { height: 16px; width: 55%; margin-bottom: 10px; }
    .sk-bar.xs { height: 16px; width: 40%; }
  </style>

  <!-- Preload API data immediately before JS loads (breaks network waterfall) -->
  <script>
    (function() {
      var base = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
      window.__PF__ = {
        hero: fetch(base + '/products?isFeatured=true&limit=5', {priority:'high'}).catch(function(){}),
        cats: fetch(base + '/categories', {priority:'low'}).catch(function(){})
      };
    })();
  </script>

  <!-- Fonts — fully non-blocking -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Static JSON-LD for Googlebot Wave 1 and AI crawlers (no JS required) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "@id": "https://al3amer.store/#organization",
    "name": "مركز العامر",
    "url": "https://al3amer.store",
    "logo": "https://i.ibb.co/KkCv1LF/Logo-Al3amer.png",
    "description": "المركز الرائد في مصر لتوريد وتركيب أجهزة الكاشير، أنظمة نقاط البيع، كاميرات المراقبة، والحلول التقنية للمحلات التجارية والمطاعم",
    "areaServed": "EG",
    "currenciesAccepted": "EGP",
    "priceRange": "$$"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://al3amer.store/#website",
    "url": "https://al3amer.store",
    "name": "مركز العامر",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://al3amer.store/shop?search={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

<body>
  <div id="root">
    <div class="sk-wrap">
      <header class="sk-header">
        <img
          src="https://i.ibb.co/KkCv1LF/Logo-Al3amer.png"
          alt="مركز العامر"
          width="120" height="40"
          class="sk-logo"
          fetchpriority="high"
        />
      </header>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>

  <noscript>
    <div style="padding: 20px; font-family: 'Cairo', sans-serif; direction: rtl; text-align: center; color: #e2e8f0; background: #0d121c; min-height: 100vh;">
      <h1 style="font-size: 2rem; margin-bottom: 1rem;">مركز العامر</h1>
      <img src="https://i.ibb.co/KkCv1LF/Logo-Al3amer.png" alt="مركز العامر" width="200" height="67" style="margin-bottom: 1rem;" />
      <p style="font-size: 1.2rem; max-width: 600px; margin: 0 auto 2rem;">
        المركز الرائد في مصر لتوريد وتركيب أجهزة الكاشير، أنظمة نقاط البيع، كاميرات المراقبة، والحلول التقنية للمحلات التجارية والمطاعم
      </p>
      <nav style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/shop" style="color: #135bec; text-decoration: none; font-size: 1.1rem;">المتجر</a>
        <a href="/offers" style="color: #135bec; text-decoration: none; font-size: 1.1rem;">العروض</a>
        <a href="/about" style="color: #135bec; text-decoration: none; font-size: 1.1rem;">من نحن</a>
        <a href="/ai-builder" style="color: #135bec; text-decoration: none; font-size: 1.1rem;">AI Bundle Builder</a>
      </nav>
    </div>
  </noscript>
</body>

</html>
