<!doctype html>
<html lang="ar" dir="rtl" class="dark">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/KkCv1LF/Logo-Al3amer.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مركز العامر - لأجهزة الكاشير وأنظمة المحاسبة</title>
  
  <!-- SEO Canonical Tag to prevent duplicate content issues -->
  <link rel="canonical" href="https://al3amer.store/" />

  <!-- Critical preconnects (max 2 for performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload Logo -->
  <link rel="preload" as="image" href="https://i.ibb.co/KkCv1LF/Logo-Al3amer.png" fetchpriority="high" />

  <style>
    :root {
      --bg: #0d121c;
      --primary: #135bec;
      --surface: #161b26;
      --text: #e2e8f0;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      margin: 0;
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #root > .sk-wrap { display: block; }
    #root.hydrated > .sk-wrap { display: none; }
    .sk-header {
      height: 80px;
      background: rgba(13,18,28,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      padding: 0 5%;
    }
    .sk-logo {
      height: 40px;
      width: 120px;
      object-fit: contain;
      opacity: 0.7;
    }
    .sk-hero {
      min-height: 550px;
      display: flex;
      align-items: center;
      padding: 40px 5%;
      background: var(--bg);
    }
    @media (min-width: 1024px) { .sk-hero { min-height: 680px; } }
    .sk-content { max-width: 700px; }
    .sk-bar {
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 16px;
      height: 48px;
      width: 75%;
    }
    .sk-bar.sm { height: 16px; width: 55%; margin-bottom: 10px; }
    .sk-bar.xs { height: 16px; width: 40%; }
  </style>

  <!-- Preload API data immediately before JS loads (breaks network waterfall) -->
  <script>
    (function() {
      var base = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
      window.__PF__ = {
        hero: fetch(base + '/products?isFeatured=true&limit=5', {priority:'high'}).catch(function(){}),
        cats: fetch(base + '/categories', {priority:'low'}).catch(function(){})
      };
    })();
  </script>

  <!-- Fonts — fully non-blocking -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet" />
  </noscript>
</head>

<body>
  <div id="root">
    <div class="sk-wrap">
      <header class="sk-header">
        <img
          src="https://i.ibb.co/KkCv1LF/Logo-Al3amer.png"
          alt="مركز العامر"
          width="120" height="40"
          class="sk-logo"
          fetchpriority="high"
        />
      </header>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
